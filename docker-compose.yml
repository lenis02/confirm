version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: confirm_postgres
    environment:
      POSTGRES_DB: confirm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
